# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Il JDK di default su questa macchina e' il 26, piu' recente di quanto supportato da
# Gradle 8.9 / AGP 8.7.1. Puntiamo esplicitamente al JBR (JDK 21) incluso in Android
# Studio, garantito compatibile con questa installazione.
org.gradle.java.home=D\:\\Android\\Android Studio\\jbr

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# connectedAndroidTest disinstalla sempre l'app (e quella dei test) a fine run per default,
# a prescindere da cosa fosse gia' installato prima - su un device di sviluppo usato anche
# a mano (non solo per CI) questo cancella la build "vera" installata (e i suoi dati, es. la
# sessione di login del gateway). Con questo flag l'APK resta installato dopo il test.
android.injected.androidTest.leaveApksInstalledAfterRun=true
