# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# The default JDK on this machine is 26, newer than what Gradle 8.9 / AGP 8.7.1 support.
# We explicitly point at the JBR (JDK 21) bundled with Android Studio, guaranteed
# compatible with this installation.
org.gradle.java.home=D\:\\Android\\Android Studio\\jbr

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# connectedAndroidTest always uninstalls the app (and the test one) at the end of the run by
# default, regardless of what was already installed before - on a development device also used
# by hand (not just for CI) this wipes out the "real" installed build (and its data, e.g. the
# gateway login session). With this flag the APK stays installed after the test.
android.injected.androidTest.leaveApksInstalledAfterRun=true
